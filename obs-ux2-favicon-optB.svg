<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LAN Observatory option B">
  <!-- Tokens: --bg-0 #0f1319 · --accent #6bc5db · --ok #4fb477 — ring+hub, no letters -->
  <style>
    .ring { fill: none; stroke: #6bc5db; stroke-width: 5; }
    .hub { fill: #4fb477; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #e8ebf0; }
      .ring { stroke: #0f1319; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="6" fill="#0f1319"/>
  <circle class="ring" cx="16" cy="16" r="10"/>
  <circle class="hub" cx="16" cy="16" r="4"/>
</svg>
